name: Safety CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: safety-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trading-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record exact tested SHA
        run: |
          echo "tested_sha=${GITHUB_SHA}" | tee safety-ci-head.txt
          echo "### Safety CI exact-head evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${GITHUB_REF}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject embedded NVIDIA API keys
        run: |
          if grep -R --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv -n "nvapi-" core agents gateway brokers ui; then
            echo "Embedded NVIDIA API key detected. Use environment secrets instead."
            exit 1
          fi
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic pydantic-settings httpx requests cryptography feedparser beautifulsoup4 numpy==1.26.4 "pandas>=2.2.3"
      - name: Compile critical Python modules
        run: |
          python -m compileall -q core brokers gateway agents self_improvement
          python -m py_compile scripts/export_precision_evidence.py scripts/live_system_smoke_resilient.py
      - name: Run trading and customer safety regression suites
        run: >-
          python -m pytest -q
          tests/test_data_validation.py
          tests/test_primary_source_retry.py
          tests/test_trading_safety.py
          tests/test_precision_gate.py
          tests/test_precision_audit.py
          tests/test_strict_live_price_session.py
          tests/test_self_improvement.py
          tests/test_customer_experience.py
          tests/test_live_integrity.py
          tests/test_systematic_research.py
          tests/test_portfolio_risk_cap.py
      - name: Summarize exact-head evidence without artifact upload
        if: always()
        run: |
          echo "- Exact-head file generated during this run; artifact upload disabled." >> "$GITHUB_STEP_SUMMARY"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record frontend exact tested SHA
        run: |
          echo "frontend_tested_sha=${GITHUB_SHA}" | tee frontend-build-head.txt
          echo "### Frontend exact-head evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci
      - name: Build customer UI
        working-directory: ui
        run: npm run build
      - name: Summarize frontend evidence without artifact upload
        if: always()
        run: |
          echo "- Frontend exact-head file generated during this run; artifact upload disabled." >> "$GITHUB_STEP_SUMMARY"

  publish-health-ledger:
    if: always()
    needs: [trading-safety, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Append Safety CI result to health ledger
        uses: actions/github-script@v7
        with:
          script: |
            const trading = '${{ needs.trading-safety.result }}';
            const frontend = '${{ needs.frontend-build.result }}';
            const overall = trading === 'success' && frontend === 'success' ? 'SUCCESS' : 'FAILURE';
            const body = [
              `### Safety CI — ${overall}`,
              `- Exact SHA: \`${context.sha}\``,
              `- Ref: \`${context.ref}\``,
              `- Event: \`${context.eventName}\``,
              `- Trading safety: **${trading.toUpperCase()}**`,
              `- Frontend build: **${frontend.toUpperCase()}**`,
              `- Artifact storage: **DISABLED**`,
              `- Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Evidence policy: measured workflow result only; no profitability or future-accuracy claim.`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 41,
              body
            });