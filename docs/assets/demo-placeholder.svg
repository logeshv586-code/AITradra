<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <!-- dashed frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- faint candlestick chart silhouette -->
  <g stroke="#30363d" stroke-width="3" opacity="0.7">
    <line x1="180" y1="430" x2="180" y2="360"/>
    <line x1="240" y1="410" x2="240" y2="330"/>
    <line x1="300" y1="450" x2="300" y2="370"/>
    <line x1="360" y1="400" x2="360" y2="300"/>
    <line x1="420" y1="420" x2="420" y2="340"/>
    <line x1="480" y1="380" x2="480" y2="280"/>
    <line x1="540" y1="440" x2="540" y2="360"/>
  </g>
  <g fill="#238636" opacity="0.85">
    <rect x="168" y="380" width="24" height="35" rx="2"/>
    <rect x="348" y="330" width="24" height="45" rx="2"/>
    <rect x="468" y="310" width="24" height="45" rx="2"/>
  </g>
  <g fill="#da3633" opacity="0.85">
    <rect x="228" y="350" width="24" height="40" rx="2"/>
    <rect x="288" y="390" width="24" height="45" rx="2"/>
    <rect x="408" y="360" width="24" height="40" rx="2"/>
    <rect x="528" y="380" width="24" height="40" rx="2"/>
  </g>

  <!-- agent swarm nodes (right side) -->
  <g stroke="url(#glow)" stroke-width="1.5" opacity="0.6" fill="none">
    <line x1="820" y1="220" x2="920" y2="180"/>
    <line x1="820" y1="220" x2="960" y2="260"/>
    <line x1="820" y1="220" x2="880" y2="330"/>
    <line x1="920" y1="180" x2="1040" y2="200"/>
    <line x1="960" y1="260" x2="1040" y2="200"/>
    <line x1="960" y1="260" x2="1000" y2="340"/>
    <line x1="880" y1="330" x2="1000" y2="340"/>
  </g>
  <g fill="#c9d1d9">
    <circle cx="820" cy="220" r="7"/>
    <circle cx="920" cy="180" r="5"/>
    <circle cx="960" cy="260" r="5"/>
    <circle cx="880" cy="330" r="5"/>
    <circle cx="1040" cy="200" r="5"/>
    <circle cx="1000" cy="340" r="5"/>
  </g>

  <!-- title -->
  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f0f6fc">AITradra</text>
  <text x="80" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">Live Multi-Agent Market Intelligence Dashboard</text>

  <!-- placeholder badge -->
  <rect x="80" y="470" width="330" height="56" rx="28" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="245" y="505" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#c9d1d9" text-anchor="middle">🎥 Demo GIF — coming soon</text>

  <text x="80" y="555" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#6e7681">Run it yourself in under 5 minutes — see Quick Start below ↓</text>
</svg>
